openapi: 3.0.0
info:
  title: CAB API
  version: 1.0.0
  description: API cho hệ thống CAB, bám theo BRD, Feature Matrix và 13 Use Case trong
    README(2).md.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Authentication
- name: Booking
- name: Trip
- name: Payment
- name: Tracking
- name: Notification
- name: Safety
- name: Driver
- name: Rating
- name: Support
- name: Report
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tài khoản được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Thông tin đăng ký không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tài khoản đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC01
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Thông tin đăng nhập không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC01
  /bookings:
    post:
      tags:
      - Booking
      summary: Đặt xe
      operationId: createBooking
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Thông tin đặt xe không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Khách hàng đang có chuyến chưa hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC02
  /bookings/{bookingId}/matching:
    post:
      tags:
      - Booking
      summary: Tìm và ghép tài xế
      operationId: matchDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Hệ thống tìm và ghép tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResponse'
        '404':
          description: Không có tài xế phù hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC03
  /bookings/{bookingId}/matching/response:
    post:
      tags:
      - Booking
      summary: Tài xế phản hồi yêu cầu nhận chuyến
      operationId: driverMatchingResponse
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingResponseRequest'
      responses:
        '200':
          description: Đã ghi nhận phản hồi của tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResponse'
        '400':
          description: Phản hồi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC03
  /trips/{tripId}/status:
    put:
      tags:
      - Trip
      summary: Cập nhật trạng thái chuyến đi
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Trạng thái không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC04
  /trips/{tripId}/fare:
    get:
      tags:
      - Trip
      summary: Tính cước chuyến đi
      operationId: calculateFare
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Tính cước thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '404':
          description: Không có bảng giá phù hợp, chuyển cho nhân viên vận hành xử
            lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC05
  /payments:
    post:
      tags:
      - Payment
      summary: Thanh toán chuyến đi
      operationId: createPayment
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Đã xử lý thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Thông tin thanh toán không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Nhà cung cấp thanh toán không xử lý được giao dịch điện tử
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC06
  /trips/{tripId}/tracking:
    get:
      tags:
      - Tracking
      summary: Theo dõi hành trình
      operationId: trackTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Hiển thị trạng thái, tài xế, vị trí và thời gian dự kiến đến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        '404':
          description: Không tìm thấy chuyến đang theo dõi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Tracking
      summary: Cập nhật vị trí tài xế
      operationId: updateDriverLocation
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Cập nhật vị trí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        '400':
          description: Vị trí không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC07
  /notifications:
    post:
      tags:
      - Notification
      summary: Gửi thông báo
      operationId: sendNotification
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Đã ghi nhận kết quả gửi thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '500':
          description: Gửi thông báo thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC08
  /sos:
    post:
      tags:
      - Safety
      summary: Gửi yêu cầu hỗ trợ khẩn cấp
      operationId: createSOS
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSRequest'
      responses:
        '201':
          description: Tạo yêu cầu SOS thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSResponse'
        '400':
          description: Thông tin SOS không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC09
  /drivers:
    get:
      tags:
      - Driver
      summary: Xem danh sách tài xế
      operationId: getDrivers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
    post:
      tags:
      - Driver
      summary: Thêm tài xế
      operationId: createDriver
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '201':
          description: Thêm tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Thông tin tài xế không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC10
  /drivers/{driverId}:
    put:
      tags:
      - Driver
      summary: Cập nhật thông tin tài xế
      operationId: updateDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '200':
          description: Cập nhật tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Thông tin tài xế không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC10
  /trips/{tripId}/ratings:
    post:
      tags:
      - Rating
      summary: Đánh giá chuyến đi
      operationId: rateTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá được lưu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Điểm đánh giá không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC11
  /support:
    get:
      tags:
      - Support
      summary: Xem danh sách yêu cầu hỗ trợ
      operationId: getSupportRequests
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách yêu cầu hỗ trợ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportRequest'
    post:
      tags:
      - Support
      summary: Gửi yêu cầu hỗ trợ
      operationId: createSupportRequest
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestInput'
      responses:
        '201':
          description: Tạo yêu cầu hỗ trợ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
        '400':
          description: Thông tin hỗ trợ không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Support
      summary: Xử lý yêu cầu hỗ trợ
      operationId: updateSupportRequest
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportUpdate'
      responses:
        '200':
          description: Cập nhật kết quả xử lý thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
        '400':
          description: Thiếu hoặc sai thông tin xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy yêu cầu hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC12
  /reports:
    get:
      tags:
      - Report
      summary: Xem báo cáo
      operationId: getReports
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Báo cáo hoạt động của hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Chưa có dữ liệu báo cáo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-use-case: UC13
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
  schemas:
    RegisterRequest:
      type: object
      required:
      - name
      - phone
      - password
      - role
      properties:
        name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: 0901234567
        password:
          type: string
          format: password
          example: '123456'
        role:
          type: string
          description: Vai trò người đăng ký
          enum:
          - customer
          - driver
    LoginRequest:
      type: object
      required:
      - phone
      - password
      properties:
        phone:
          type: string
          example: 0901234567
        password:
          type: string
          format: password
          example: '123456'
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: Đăng nhập thành công
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
    BookingRequest:
      type: object
      required:
      - pickup
      - destination
      - vehicleType
      properties:
        pickup:
          type: string
          example: Đại học Công nghiệp TP.HCM
        destination:
          type: string
          example: Sân bay Tân Sơn Nhất
        vehicleType:
          type: string
          enum:
          - car4
          - car7
          example: car4
    Booking:
      allOf:
      - $ref: '#/components/schemas/BookingRequest'
      - type: object
        properties:
          bookingId:
            type: string
            example: BK001
          status:
            type: string
            enum:
            - pending
            - searching
            - matched
            - cancelled
            - completed
            example: pending
          driverId:
            type: string
            description: Có giá trị khi chuyến đã được ghép tài xế.
    MatchingResponse:
      type: object
      properties:
        bookingId:
          type: string
          example: BK001
        driverId:
          type: string
          example: TX001
        status:
          type: string
          enum:
          - matched
          - searching
          - no_driver
          example: matched
        message:
          type: string
    MatchingResponseRequest:
      type: object
      required:
      - driverId
      - response
      properties:
        driverId:
          type: string
          example: TX001
        response:
          type: string
          enum:
          - accepted
          - rejected
          example: accepted
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - accepted
          - arrived
          - in_progress
          - completed
          - cancelled
    Trip:
      type: object
      properties:
        tripId:
          type: string
        bookingId:
          type: string
        driverId:
          type: string
        status:
          type: string
          enum:
          - accepted
          - arrived
          - in_progress
          - completed
          - cancelled
    FareResponse:
      type: object
      properties:
        tripId:
          type: string
        amount:
          type: number
          format: double
          example: 85000
    PaymentRequest:
      type: object
      required:
      - tripId
      - method
      properties:
        tripId:
          type: string
        method:
          type: string
          enum:
          - cash
          - electronic
    PaymentResponse:
      type: object
      properties:
        transactionId:
          type: string
        tripId:
          type: string
        status:
          type: string
          enum:
          - success
          - failed
        message:
          type: string
    LocationRequest:
      type: object
      required:
      - location
      properties:
        location:
          type: string
          description: Vị trí hiện tại của tài xế, dạng latitude,longitude.
          example: 10.8231,106.6297
    TrackingResponse:
      type: object
      properties:
        tripId:
          type: string
        status:
          type: string
          enum:
          - accepted
          - arrived
          - in_progress
          - completed
          - cancelled
        driverId:
          type: string
        location:
          type: string
          description: Vị trí hiện tại nếu hệ thống nhận được.
          example: 10.8231,106.6297
        eta:
          type: integer
          description: Thời gian dự kiến còn lại, tính bằng phút.
          example: 8
    NotificationRequest:
      type: object
      required:
      - recipient
      - content
      properties:
        recipient:
          type: string
          description: Người nhận thông báo, ví dụ mã khách hàng hoặc tài xế.
        content:
          type: string
    NotificationResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - sent
          - failed
        message:
          type: string
    SOSRequest:
      type: object
      required:
      - tripId
      properties:
        tripId:
          type: string
        location:
          type: string
          nullable: true
          description: Vị trí nếu hệ thống lấy được; có thể để trống khi không lấy
            được vị trí.
          example: 10.8231,106.6297
    SOSResponse:
      type: object
      properties:
        sosId:
          type: string
        tripId:
          type: string
        location:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - created
          - processing
          - resolved
    DriverRequest:
      type: object
      required:
      - name
      - phone
      - vehicle
      properties:
        name:
          type: string
        phone:
          type: string
        vehicle:
          type: string
        status:
          type: string
          enum:
          - ready
          - busy
          - inactive
    Driver:
      allOf:
      - $ref: '#/components/schemas/DriverRequest'
      - type: object
        properties:
          driverId:
            type: string
    RatingRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Rating:
      allOf:
      - $ref: '#/components/schemas/RatingRequest'
      - type: object
        properties:
          tripId:
            type: string
          driverId:
            type: string
    SupportRequestInput:
      type: object
      required:
      - type
      - content
      properties:
        type:
          type: string
          example: Khiếu nại chuyến đi
        content:
          type: string
    SupportRequest:
      allOf:
      - $ref: '#/components/schemas/SupportRequestInput'
      - type: object
        properties:
          supportId:
            type: string
          tripId:
            type: string
          requesterId:
            type: string
          status:
            type: string
            enum:
            - pending
            - processing
            - resolved
          result:
            type: string
    SupportUpdate:
      type: object
      required:
      - supportId
      - result
      properties:
        supportId:
          type: string
        result:
          type: string
        status:
          type: string
          enum:
          - processing
          - resolved
    Report:
      type: object
      properties:
        totalTrips:
          type: integer
          example: 1200
        revenue:
          type: number
          format: double
          example: 85000000
        completionRate:
          type: number
          format: double
          example: 0.92
        cancellationRate:
          type: number
          format: double
          example: 0.08
        driverPerformance:
          type: array
          items:
            type: object
            properties:
              driverId:
                type: string
              completedTrips:
                type: integer
              averageRating:
                type: number
                format: double
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: INVALID_DATA
        message:
          type: string
          example: Thông tin không hợp lệ
